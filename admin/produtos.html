<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Produtos</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/db.js"></script>
    <style>
        .admin-container { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--card); padding: 2rem 1rem; border-right: 2px solid var(--roxo); }
        .sidebar h2 { color: var(--roxo); margin-bottom: 2rem; text-align: center; font-size: 1.3rem; }
        .sidebar nav a { display: block; padding: 1rem; color: var(--texto); text-decoration: none; border-radius: 8px; margin-bottom: 0.5rem; transition: all 0.3s; }
        .sidebar nav a:hover, .sidebar nav a.ativo { background: var(--roxo); color: white; }
        .content { flex: 1; padding: 2rem; }
        .btn-adicionar { background: var(--verde); color: white; padding: 0.8rem 1.5rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 2rem; }
        .form-produto { background: var(--card); padding: 2rem; border-radius: 10px; margin-bottom: 2rem; display: none; }
        .form-produto.ativo { display: block; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 0.8rem; background: var(--fundo); border: 2px solid var(--roxo); border-radius: 8px; color: var(--texto); font-size: 1rem; }
        .upload-area { border: 2px dashed var(--roxo); border-radius: 10px; padding: 2rem; text-align: center; cursor: pointer; background: var(--fundo); }
        .preview-imagem { width: 100%; max-height: 250px; object-fit: cover; border-radius: 10px; margin-top: 1rem; display: none; }
        .preview-imagem.ativo { display: block; }
        .btn-remover-imagem { background: #ef4444; color: white; padding: 0.5rem 1rem; border: none; border-radius: 5px; cursor: pointer; margin-top: 0.5rem; display: none; }
        .btn-remover-imagem.ativo { display: inline-block; }
        .tabela-produtos { background: var(--card); border-radius: 10px; padding: 1rem; overflow-x: auto; }
        .tabela-produtos table { width: 100%; border-collapse: collapse; }
        .tabela-produtos th { text-align: left; padding: 1rem; border-bottom: 2px solid var(--roxo); color: var(--amarelo); }
        .tabela-produtos td { padding: 1rem; border-bottom: 1px solid #333; }
        .btn-editar { background: var(--amarelo); color: #000; padding: 0.5rem 1rem; border: none; border-radius: 5px; cursor: pointer; margin-right: 0.5rem; }
        .btn-remover { background: #ef4444; color: white; padding: 0.5rem 1rem; border: none; border-radius: 5px; cursor: pointer; }
        .btn-salvar { background: var(--verde); color: white; padding: 0.8rem 1.5rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-right: 0.5rem; }
        .btn-cancelar-form { background: #64748b; color: white; padding: 0.8rem 1.5rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        @media (max-width: 768px) { .admin-container { flex-direction: column; } .sidebar { width: 100%; } .sidebar nav { display: flex; flex-wrap: wrap; gap: 0.5rem; } .sidebar nav a { flex: 1; text-align: center; min-width: 120px; } }
    </style>
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <h2>⚙️ Admin</h2>
            <nav>
                <a href="dashboard.html">📊 Dashboard</a>
                <a href="produtos.html" class="ativo">📦 Produtos</a>
                <a href="categorias.html">📂 Categorias</a>
                <a href="pedidos.html">📋 Pedidos</a>
                <a href="cupons.html">🏷️ Cupons</a>
                <a href="staff.html">👥 Staff</a>
                <a href="configuracoes.html">🎨 Configurações</a>
                <a href="../index.html" class="ver-loja">🏪 Ver Loja</a>
                <a href="#" onclick="sair()">🚪 Sair</a>
            </nav>
        </aside>

        <main class="content">
            <h1>📦 Gerenciar Produtos</h1>
            <button class="btn-adicionar" onclick="mostrarForm()">➕ Adicionar Produto</button>
            
            <div class="form-produto" id="form-produto">
                <h2 id="form-titulo">➕ Novo Produto</h2>
                <div class="input-group"><label>🏷️ Nome</label><input type="text" id="nome-produto" placeholder="Ex: VIP Mensal"></div>
                <div class="input-group"><label>💰 Preço Original (R$)</label><input type="number" id="preco-produto" placeholder="29.90" step="0.01"></div>
                <div class="input-group"><label>💥 Preço Promocional</label><input type="number" id="preco-promo" placeholder="Opcional" step="0.01"></div>
                <div class="input-group"><label>📂 Categoria</label><select id="categoria-produto"><option value="">Nenhuma</option></select></div>
                <div class="input-group"><label>😀 Emoji</label><input type="text" id="emoji-produto" placeholder="👑" maxlength="2"></div>
                <div class="input-group"><label>🖼️ Imagem</label><div class="upload-area" onclick="document.getElementById('input-imagem').click()"><div style="font-size:3rem;">📁</div><p>Clique para upload (máx 200KB)</p></div><input type="file" id="input-imagem" accept="image/*" style="display:none;" onchange="previewImagem(this)"><img id="preview-imagem" class="preview-imagem"><button id="btn-remover-imagem" class="btn-remover-imagem" onclick="removerImagem()">🗑️ Remover</button><small>Ou URL:</small><input type="url" id="url-imagem" placeholder="https://imgur.com/..." oninput="previewUrl(this.value)"></div>
                <div class="input-group"><label>📝 Descrição</label><textarea id="descricao-produto" placeholder="Descreva o produto..."></textarea></div>
                <button class="btn-salvar" onclick="salvarProduto()">💾 Salvar</button>
                <button class="btn-cancelar-form" onclick="fecharForm()">Cancelar</button>
            </div>

            <div class="tabela-produtos"><table><thead><tr><th>Img</th><th>Produto</th><th>Preço</th><th>Categoria</th><th>Ações</th></tr></thead><tbody id="lista-produtos-admin"></tbody></table></div>
        </main>
    </div>
    <script src="../js/admin.js"></script>
</body>
</html>
