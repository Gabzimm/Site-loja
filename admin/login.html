<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Login</title>
<link rel="stylesheet" href="../css/style.css">
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.login-box { background:var(--card); padding:3rem; border-radius:15px; text-align:center; border:2px solid var(--roxo); max-width:400px; }
.login-box h1 { color:var(--amarelo); margin-bottom:1.5rem; }
.btn-login-discord { background:#5865F2; color:white; border:none; padding:1rem 2rem; border-radius:8px; cursor:pointer; font-weight:bold; font-size:1rem; }
.erro-msg { color:#ef4444; margin-top:1rem; display:none; }
.erro-msg.mostrar { display:block; }
</style>
</head>
<body>
<div class="login-box">
    <h1>🔐 Admin</h1>
    <p style="color:var(--texto-cinza);margin-bottom:1.5rem;">Faça login com uma conta Discord autorizada</p>
    <button class="btn-login-discord" onclick="loginDiscord()">Login com Discord</button>
    <p class="erro-msg" id="erro-msg">Essa conta não tem permissão de admin.</p>
</div>
<script>
var DISCORD_CLIENT_ID = '1515464456719695952';
var REDIRECT_URI = 'https://www.reycraft-hc.shop/admin/login.html'; // fixo — nunca muda mesmo se acessar sem o www

function loginDiscord() {
    var u = 'https://discord.com/api/oauth2/authorize?client_id=' + DISCORD_CLIENT_ID +
        '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) + '&response_type=code&scope=identify';
    window.location.href = u;
}

// Se voltamos do Discord com um "code" na URL, troca pelo token no backend
(function() {
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    if (!code) return;

    fetch('/api/discord-callback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code, redirect_uri: REDIRECT_URI })
    }).then(function(r) { return r.json(); }).then(function(data) {
        if (!data.admin) {
            document.getElementById('erro-msg').classList.add('mostrar');
            return;
        }
        localStorage.setItem('usuario_discord', JSON.stringify(data.usuario));
        localStorage.setItem('admin_sessao', data.sessao);
        window.location.href = 'dashboard.html';
    }).catch(function() {
        document.getElementById('erro-msg').classList.add('mostrar');
    });
})();
</script>
</body>
</html>
