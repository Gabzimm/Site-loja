<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="../js/db.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0f;
        }
        .login-box {
            background: #14141f;
            padding: 2.5rem;
            border-radius: 15px;
            border: 2px solid #8B5CF6;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .login-box h2 { color: #F59E0B; margin-bottom: 0.5rem; font-size: 1.8rem; }
        .login-box .subtitulo { color: #94A3B8; margin-bottom: 2rem; }
        .login-box .erro { color: #ef4444; margin-top: 1rem; display: none; }
        .btn-discord {
            background: #5865F2; color: white; border: none;
            padding: 1rem 2rem; border-radius: 8px; font-size: 1.1rem;
            cursor: pointer; font-weight: bold; width: 100%;
            transition: all 0.3s;
        }
        .btn-discord:hover { background: #4752C4; }
        .btn-voltar {
            display: block; margin-top: 1rem; color: #F59E0B; text-decoration: none;
        }
        .loader {
            width: 40px; height: 40px; border: 4px solid #8B5CF6;
            border-top-color: #F59E0B; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 1rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 Painel Admin</h2>
        <p class="subtitulo" id="subtitulo">Faça login com Discord para acessar</p>
        <div id="login-content">
            <button class="btn-discord" onclick="loginDiscord()">🔑 Login com Discord</button>
        </div>
        <p class="erro" id="erro-msg">❌ Você não tem permissão de administrador!</p>
        <a href="../index.html" class="btn-voltar">← Voltar para Loja</a>
    </div>

    <script>
        var DISCORD_CLIENT_ID = '1515464456719695952';
        var REDIRECT_URI = 'https://reycraft-hc.shop/admin/login.html';
        
        // Admin Master e lista de staffs
        var ADMINS = JSON.parse(localStorage.getItem('admins')) || ['1213819385576300595'];
        
        function loginDiscord() {
            var authUrl = 'https://discord.com/api/oauth2/authorize?client_id=' + DISCORD_CLIENT_ID + 
                '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) + 
                '&response_type=code&scope=identify';
            window.location.href = authUrl;
        }

        function verificarAdmin() {
            var urlParams = new URLSearchParams(window.location.search);
            var code = urlParams.get('code');
            
            if (!code) {
                // Sem código, verificar se já está logado
                var usuario = JSON.parse(localStorage.getItem('usuario_discord'));
                if (usuario && ADMINS.indexOf(usuario.id) !== -1) {
                    localStorage.setItem('admin_logado', 'true');
                    window.location.href = 'dashboard.html';
                }
                return;
            }
            
            // Mostrar loader
            document.getElementById('login-content').innerHTML = '<div class="loader"></div><p style="color:#94A3B8;">Verificando...</p>';
            document.getElementById('subtitulo').textContent = 'Aguarde...';
            
            // Trocar código por token
            fetch('https://discord.com/api/oauth2/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: DISCORD_CLIENT_ID,
                    client_secret: 'SEU_CLIENT_SECRET_AQUI',
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: REDIRECT_URI
                })
            })
            .then(function(r) { return r.json(); })
            .then(function(tokenData) {
                if (tokenData.error) throw new Error(tokenData.error_description);
                
                return fetch('https://discord.com/api/users/@me', {
                    headers: { 'Authorization': 'Bearer ' + tokenData.access_token }
                });
            })
            .then(function(r) { return r.json(); })
            .then(function(userData) {
                // Salvar dados do usuário
                var usuario = {
                    id: userData.id,
                    username: userData.username,
                    discriminator: userData.discriminator || '0',
                    avatar: userData.avatar 
                        ? 'https://cdn.discordapp.com/avatars/' + userData.id + '/' + userData.avatar + '.png?size=256'
                        : 'https://cdn.discordapp.com/embed/avatars/0.png?size=256',
                    global_name: userData.global_name || userData.username,
                    loggedAt: new Date().toISOString()
                };
                localStorage.setItem('usuario_discord', JSON.stringify(usuario));
                
                // Verificar se é admin
                if (ADMINS.indexOf(userData.id) !== -1) {
                    localStorage.setItem('admin_logado', 'true');
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('login-content').innerHTML = '<button class="btn-discord" onclick="loginDiscord()">🔑 Login com Discord</button>';
                    document.getElementById('erro-msg').style.display = 'block';
                    document.getElementById('subtitulo').textContent = 'Faça login com Discord para acessar';
                }
            })
            .catch(function(err) {
                document.getElementById('login-content').innerHTML = '<button class="btn-discord" onclick="loginDiscord()">🔑 Login com Discord</button>';
                document.getElementById('erro-msg').textContent = '❌ Erro: ' + err.message;
                document.getElementById('erro-msg').style.display = 'block';
                document.getElementById('subtitulo').textContent = 'Faça login com Discord para acessar';
            });
        }

        verificarAdmin();
    </script>
</body>
</html>
