<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="titulo-pagina">ReyCraft Shop - Conectando...</title>
    <link id="favicon-pagina" rel="icon" href="https://i.imgur.com/TneGRwW.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0f; color: #E2E8F0; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .loader { width: 60px; height: 60px; border: 5px solid #8B5CF6; border-top-color: #F59E0B; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .box { background: #14141f; padding: 3rem; border-radius: 15px; border: 2px solid #8B5CF6; max-width: 500px; width: 90%; }
    </style>
</head>
<body>
    <div class="box">
        <div class="loader"></div>
        <h2 style="color:#F59E0B;">Conectando ao Discord...</h2>
        <p id="status" style="color:#94A3B8;">Aguarde um momento</p>
    </div>

    <script>
        (function() {
            var config = JSON.parse(localStorage.getItem('config_loja'));
            if (config) {
                if (config.nomeSite) document.getElementById('titulo-pagina').textContent = config.nomeSite;
                if (config.favicon) document.getElementById('favicon-pagina').href = config.favicon;
            }
        })();

        var DISCORD_CLIENT_ID = '1515464456719695952';
        var DISCORD_CLIENT_SECRET = 'BxIwFvl6Hn7DvW4b6BwEvCxDrLr9YSb_';
        var REDIRECT_URI = 'https://reycraft-hc.shop/callback.html';
        var GUILD_ID = '1332289203127582780';

        async function buscarClan(userId) {
            var config = JSON.parse(localStorage.getItem('config_loja'));
            var BOT_TOKEN = config ? config.botToken : '';
            
            if (!BOT_TOKEN) {
                console.log('⚠️ Token do bot não configurado');
                return null;
            }
            
            try {
                // Buscar membro
                var memberRes = await fetch(
                    'https://discord.com/api/guilds/' + GUILD_ID + '/members/' + userId,
                    { headers: { 'Authorization': 'Bot ' + BOT_TOKEN } }
                );
                
                if (!memberRes.ok) {
                    console.log('⚠️ Membro não encontrado no servidor');
                    return null;
                }
                
                var memberData = await memberRes.json();
                
                // Buscar todos os cargos
                var rolesRes = await fetch(
                    'https://discord.com/api/guilds/' + GUILD_ID + '/roles',
                    { headers: { 'Authorization': 'Bot ' + BOT_TOKEN } }
                );
                var rolesData = await rolesRes.json();
                
                // Procurar clan
                var clanEncontrado = null;
                if (memberData.roles) {
                    for (var i = 0; i < memberData.roles.length; i++) {
                        var roleId = memberData.roles[i];
                        var role = rolesData.find(function(r) { return r.id === roleId; });
                        if (role && role.name.startsWith('・ ')) {
                            clanEncontrado = role.name.replace('・ ', '');
                            break;
                        }
                    }
                }
                
                return clanEncontrado;
                
            } catch(e) {
                console.log('❌ Erro ao buscar clan:', e);
                return null;
            }
        }

        async function handleCallback() {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            
            if (!code) { 
                document.getElementById('status').textContent = '❌ Erro: Código não encontrado'; 
                return; 
            }
            
            try {
                document.getElementById('status').textContent = '🔄 Verificando identidade...';
                
                var tokenRes = await fetch('https://discord.com/api/oauth2/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ 
                        client_id: DISCORD_CLIENT_ID, 
                        client_secret: DISCORD_CLIENT_SECRET, 
                        grant_type: 'authorization_code', 
                        code: code, 
                        redirect_uri: REDIRECT_URI 
                    })
                });
                var tokenData = await tokenRes.json();
                if (tokenData.error) throw new Error(tokenData.error_description);
                
                document.getElementById('status').textContent = '📡 Buscando seus dados...';
                
                var userRes = await fetch('https://discord.com/api/users/@me', { 
                    headers: { 'Authorization': 'Bearer ' + tokenData.access_token } 
                });
                var userData = await userRes.json();
                
                var usuario = {
                    id: userData.id,
                    username: userData.username,
                    discriminator: userData.discriminator || '0',
                    avatar: userData.avatar 
                        ? 'https://cdn.discordapp.com/avatars/' + userData.id + '/' + userData.avatar + '.png?size=256' 
                        : 'https://cdn.discordapp.com/embed/avatars/0.png?size=256',
                    global_name: userData.global_name || userData.username,
                    loggedAt: new Date().toISOString()
                };
                
                localStorage.setItem('usuario_discord', JSON.stringify(usuario));
                
                // Buscar clan
                document.getElementById('status').textContent = '🔍 Verificando seu clan...';
                var clan = await buscarClan(userData.id);
                
                if (clan) {
                    localStorage.setItem('meu_clan_' + userData.id, clan);
                    console.log('✅ Clan encontrado:', clan);
                } else {
                    console.log('ℹ️ Nenhum clan encontrado');
                }
                
                document.getElementById('status').textContent = '✅ Login realizado! Redirecionando...';
                document.getElementById('status').style.color = '#10B981';
                
                setTimeout(function() {
                    var redirect = localStorage.getItem('redirect_after_login') || 'index.html';
                    localStorage.removeItem('redirect_after_login');
                    window.location.href = redirect;
                }, 1000);
                
            } catch(e) {
                console.error(e);
                document.getElementById('status').innerHTML = '❌ Erro: ' + e.message + '<br><br><a href="index.html" style="color:#F59E0B;">← Voltar</a>';
            }
        }
        
        handleCallback();
    </script>
</body>
</html>
