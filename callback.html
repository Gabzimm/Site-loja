<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Entrando...</title>
<style>
body{background:#0a0a0f;color:#E2E8F0;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.box{text-align:center;}
</style>
</head>
<body>
<div class="box">
  <h2>🔄 Entrando com Discord...</h2>
  <p id="msg" style="color:#94A3B8;margin-top:0.5rem;"></p>
</div>
<script>
var REDIRECT_URI = window.location.origin + '/callback.html';
var params = new URLSearchParams(window.location.search);
var code = params.get('code');

if (!code) {
  document.getElementById('msg').textContent = 'Código não encontrado.';
} else {
  fetch('/api/discord-callback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code, redirect_uri: REDIRECT_URI })
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (!data.usuario) { document.getElementById('msg').textContent = 'Falha no login.'; return; }
    localStorage.setItem('usuario_discord', JSON.stringify(data.usuario));
    var destino = localStorage.getItem('redirect_after_login') || 'index.html';
    localStorage.removeItem('redirect_after_login');
    window.location.href = destino;
  }).catch(function() {
    document.getElementById('msg').textContent = 'Erro ao conectar. Tente novamente.';
  });
}
</script>
</body>
</html>
