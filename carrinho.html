<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="titulo-pagina">ReyCraft Shop - Carrinho</title>
<link id="favicon-pagina" rel="icon" href="https://i.imgur.com/TneGRwW.png">
<script src="js/db.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --roxo: #8B5CF6; --verde: #10B981; --amarelo: #F59E0B; --fundo: #0a0a0f; --card: #14141f; --texto: #E2E8F0; --texto-cinza: #94A3B8; }
body { font-family: 'Segoe UI', sans-serif; background: var(--fundo); color: var(--texto); min-height: 100vh; }
.header { background: #0a0a0f; padding: 0.8rem 2rem; display: flex; align-items: center; justify-content: space-between; }
.header-logo img { height: 40px; }
.header-voltar { color: var(--amarelo); text-decoration: none; font-weight: bold; }
.carrinho-container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
.carrinho-container h1 { color: var(--amarelo); margin-bottom: 2rem; }
.carrinho-vazio { text-align: center; padding: 4rem; background: var(--card); border-radius: 12px; }
.carrinho-grid { display: flex; gap: 2rem; align-items: flex-start; }
.carrinho-itens { flex: 1; min-width: 0; }
.carrinho-resumo { width: 360px; flex-shrink: 0; position: sticky; top: 1.5rem; }
.carrinho-item { display: flex; align-items: center; background: var(--card); padding: 1.2rem; border-radius: 10px; margin-bottom: 0.8rem; gap: 1rem; }
.carrinho-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
.carrinho-item-emoji { font-size: 2.5rem; width: 60px; text-align: center; }
.carrinho-item-info { flex: 1; }
.carrinho-item-nome { font-weight: bold; }
.carrinho-item-preco { color: var(--verde); font-weight: bold; font-size: 0.9rem; }
.carrinho-qtd { display: flex; align-items: center; gap: 0.5rem; }
.btn-qtd { background: var(--roxo); color: white; border: none; width: 28px; height: 28px; border-radius: 5px; cursor: pointer; }
.btn-remover { background: #ef4444; color: white; border: none; padding: 0.5rem 0.8rem; border-radius: 5px; cursor: pointer; }
.cupom-section, .pagamento-section { background: var(--card); padding: 1.5rem; border-radius: 10px; margin-bottom: 1rem; }
.cupom-section h3, .pagamento-section h3 { color: var(--amarelo); margin-bottom: 1rem; font-size: 1rem; }
.cupom-input { display: flex; gap: 0.5rem; }
.cupom-input input { flex: 1; min-width: 0; padding: 0.7rem; background: #0a0a0f; border: 1px solid #1e1e2e; border-radius: 8px; color: var(--texto); }
.cupom-input button { background: var(--amarelo); color: #000; border: none; padding: 0.7rem 1rem; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; }
.cupom-aplicado { display: flex; justify-content: space-between; align-items: center; background: rgba(16,185,129,0.1); padding: 0.8rem; border-radius: 8px; }
.cupom-aplicado span { color: var(--verde); font-weight: bold; }
.cupom-erro-msg { color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
.cupom-erro-msg.mostrar { display: block; }
.pagamento-opcoes { display: flex; flex-direction: column; gap: 0.6rem; }
.pagamento-opt { background: #0a0a0f; border: 2px solid #1e1e2e; padding: 0.9rem 1rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 0.6rem; font-weight: 500; }
.pagamento-opt small { color: var(--texto-cinza); font-weight: normal; }
.pagamento-opt.selecionado { border-color: var(--verde); background: rgba(16,185,129,0.1); }
.euro-preview { color: var(--amarelo); font-weight: bold; margin-top: 0.8rem; text-align: center; }
.token-clan-section { background: var(--card); padding: 1.5rem; border-radius: 10px; margin-bottom: 1rem; border: 2px solid var(--amarelo); }
.token-clan-section h3 { color: var(--amarelo); margin-bottom: 0.5rem; font-size: 1rem; }
.token-clan-section small { color: var(--texto-cinza); display: block; margin-bottom: 0.8rem; }
.token-clan-section input { width: 100%; padding: 0.8rem; background: #0a0a0f; border: 2px solid var(--amarelo); border-radius: 8px; color: var(--texto); text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
.modal-pix-fundo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.modal-pix-box { background: var(--card); border-radius: 15px; padding: 2rem; max-width: 380px; width: 100%; text-align: center; }
.modal-pix-box h3 { color: var(--amarelo); margin-bottom: 1rem; }
.modal-pix-box img { width: 220px; height: 220px; background: white; padding: 8px; border-radius: 10px; margin-bottom: 1rem; }
.pix-copia-cola { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.pix-copia-cola input { flex: 1; padding: 0.6rem; background: #0a0a0f; border: 1px solid #1e1e2e; border-radius: 8px; color: var(--texto-cinza); font-size: 0.75rem; }
.pix-copia-cola button { background: var(--verde); color: white; border: none; padding: 0.6rem 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
.modal-pix-aviso { color: var(--texto-cinza); font-size: 0.85rem; margin-bottom: 1rem; }
.modal-pix-fechar { background: #64748b; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 8px; cursor: pointer; width: 100%; }
.carrinho-total { background: var(--card); padding: 1.5rem; border-radius: 10px; }
.total-linha { display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: var(--texto-cinza); }
.total-final { font-size: 1.5rem; font-weight: bold; color: var(--verde); padding-top: 0.5rem; border-top: 1px solid #1e1e2e; }
.btn-finalizar { width: 100%; padding: 1rem; background: var(--verde); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 1rem; }
.btn-finalizar:disabled { background: #64748b; cursor: not-allowed; }
.aviso-login { background: rgba(245,158,11,0.1); border: 1px solid var(--amarelo); border-radius: 10px; padding: 1rem; text-align: center; }
.btn-login-discord { background: #5865F2; color: white; border: none; padding: 0.8rem 2rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
.toast-aviso { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--verde); color: white; padding: 1rem 2rem; border-radius: 10px; font-weight: bold; z-index: 9999; animation: slideUp 0.3s ease, fadeOutToast 2.5s forwards; }
.toast-erro { background: #ef4444; }
@keyframes slideUp { from { transform: translateX(-50%) translateY(100px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
@keyframes fadeOutToast { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
@media (max-width: 768px) {
  .carrinho-grid { flex-direction: column; }
  .carrinho-resumo { width: 100%; position: static; }
}
</style>
</head>
<body>
<header class="header">
<a href="index.html" class="header-voltar">← Voltar</a>
<a href="index.html" class="header-logo"><img src="https://i.imgur.com/TneGRwW.png" id="logo-img"></a>
<div></div>
</header>
<div class="carrinho-container"><h1>🛒 Seu Carrinho</h1><div id="carrinho-content"></div></div>
<script>
(function(){var c=JSON.parse(localStorage.getItem('config_loja')); if(c){if(c.nomeSite)document.getElementById('titulo-pagina').textContent=c.nomeSite+' - Carrinho'; if(c.favicon)document.getElementById('favicon-pagina').href=c.favicon; if(c.logoUrl){var l=document.getElementById('logo-img');if(l)l.src=c.logoUrl;} if(c.logoTamanho){var l=document.getElementById('logo-img');if(l)l.style.height=c.logoTamanho+'px';}}})();

var DISCORD_CLIENT_ID='1515464456719695952', REDIRECT_URI='https://www.reycraft-hc.shop/callback.html';
var carrinho=JSON.parse(localStorage.getItem('carrinho'))||[], cupons=[], produtosSync=[], cupomAplicado=null, metodoSelecionado=null, valorEuroPreview=null, tokenClan='', usuario=JSON.parse(localStorage.getItem('usuario_discord'));

// Ao voltar do Mercado Pago/Stripe com ?status=..., avisa o usuário (a confirmação real vem do webhook, não da URL)
(function(){
  var params=new URLSearchParams(window.location.search);
  var status=params.get('status');
  if(status==='sucesso') setTimeout(function(){mostrarToast('✅ Pagamento recebido! Assim que for aprovado seu pedido é confirmado automaticamente.');},300);
  if(status==='falha') setTimeout(function(){mostrarToast('❌ Pagamento não concluído.','erro');},300);
})();

sincronizarLocalStorage().then(function(){ cupons=JSON.parse(localStorage.getItem('cupons'))||[]; produtosSync=JSON.parse(localStorage.getItem('produtos'))||[]; renderizarCarrinho(); });

function mostrarToast(m,t){var toast=document.createElement('div'); toast.className='toast-aviso'+(t==='erro'?' toast-erro':''); toast.textContent=m; document.body.appendChild(toast); setTimeout(function(){if(toast.parentNode)toast.parentNode.removeChild(toast);},4000);}
function salvarCarrinho(){localStorage.setItem('carrinho',JSON.stringify(carrinho)); renderizarCarrinho();}
function removerItem(id){carrinho=carrinho.filter(function(i){return i.id!==id}); salvarCarrinho(); mostrarToast('Item removido');}
function alterarQuantidade(id,d){var i=carrinho.find(function(x){return x.id===id}); if(i){i.quantidade+=d; if(i.quantidade<=0){removerItem(id);return;} salvarCarrinho();}}
function calcularSubtotal(){return carrinho.reduce(function(t,i){return t+(i.preco*i.quantidade)},0);}
function calcularDesconto(){if(!cupomAplicado)return 0; var s=calcularSubtotal(); return cupomAplicado.tipo==='porcentagem'?s*(cupomAplicado.valor/100):Math.min(cupomAplicado.valor,s);}
function calcularTotal(){return Math.max(0,calcularSubtotal()-calcularDesconto());}
function temVipClanNoCarrinho(){
  return carrinho.some(function(item){
    var p=produtosSync.find(function(x){return x.id===item.id});
    return p && p.ehVipClan;
  });
}

function aplicarCupom(){
  var codigo=document.getElementById('input-cupom').value.trim().toUpperCase();
  var erroEl=document.getElementById('cupom-erro-msg');
  if(!codigo){erroEl.textContent='Digite um código.'; erroEl.classList.add('mostrar'); return;}
  var cupom=cupons.find(function(c){return c.codigo===codigo&&c.ativo&&c.usos<c.limite});
  if(cupom){cupomAplicado=cupom; erroEl.classList.remove('mostrar'); document.getElementById('input-cupom').value=''; renderizarCarrinho(); mostrarToast('✅ Cupom '+cupom.codigo+' aplicado!');}
  else{erroEl.textContent='Cupom errado, veja se digitou corretamente.'; erroEl.classList.add('mostrar');}
}
function removerCupom(){cupomAplicado=null; renderizarCarrinho();}

function selecionarMetodo(m){
  metodoSelecionado=m;
  if(m==='mby'){
    valorEuroPreview='...';
    renderizarCarrinho();
    fetch('/api/cotacao?valor='+calcularTotal().toFixed(2))
      .then(function(r){return r.json();})
      .then(function(d){ valorEuroPreview=d.valorEUR; renderizarCarrinho(); })
      .catch(function(){ valorEuroPreview=null; renderizarCarrinho(); });
  } else {
    valorEuroPreview=null;
    renderizarCarrinho();
  }
}
function loginDiscord(){var u='https://discord.com/api/oauth2/authorize?client_id='+DISCORD_CLIENT_ID+'&redirect_uri='+encodeURIComponent(REDIRECT_URI)+'&response_type=code&scope=identify'; localStorage.setItem('redirect_after_login','carrinho.html'); window.location.href=u;}

function finalizarCompra(){
  usuario=JSON.parse(localStorage.getItem('usuario_discord'));
  if(!usuario){mostrarToast('Faça login!','erro');return;}
  if(carrinho.length===0){mostrarToast('Carrinho vazio!','erro');return;}
  if(!metodoSelecionado){mostrarToast('Escolha a forma de pagamento!','erro');return;}
  if(temVipClanNoCarrinho() && !tokenClan.trim()){mostrarToast('Digite o Token do Clã!','erro');return;}
  var btn=document.querySelector('.btn-finalizar'); btn.disabled=true; btn.textContent='Redirecionando...';

  fetch('/api/create-payment', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      discord_id: usuario.id,
      nome: usuario.global_name || usuario.username,
      itens: carrinho.map(function(i){return {id:i.id, nome:i.nome, preco:i.preco, quantidade:i.quantidade};}),
      cupom: cupomAplicado ? cupomAplicado.codigo : null,
      metodo: metodoSelecionado,
      tokenClan: tokenClan.trim() || null
    })
  }).then(function(r){return r.json();}).then(function(resp){
    if(resp.tipo==='pix'){
      localStorage.removeItem('carrinho');
      mostrarModalPix(resp.qr_code, resp.qr_code_base64);
      btn.disabled=false; btn.textContent='✅ Ir para pagamento';
    } else if(resp.url){
      localStorage.removeItem('carrinho');
      window.location.href = resp.url; // vai pro checkout do Mercado Pago ou Stripe
    } else {
      mostrarToast('Erro ao gerar pagamento.','erro');
      btn.disabled=false; btn.textContent='✅ Ir para pagamento';
    }
  }).catch(function(){
    mostrarToast('Erro ao gerar pagamento.','erro');
    btn.disabled=false; btn.textContent='✅ Ir para pagamento';
  });
}

function mostrarModalPix(qrCode, qrCodeBase64){
  var m=document.createElement('div');
  m.className='modal-pix-fundo';
  m.innerHTML='<div class="modal-pix-box">'+
    '<h3>📱 Pague com PIX</h3>'+
    '<img src="data:image/png;base64,'+qrCodeBase64+'" alt="QR Code PIX">'+
    '<div class="modal-pix-aviso">Escaneie o QR Code no app do seu banco, ou copie o código abaixo:</div>'+
    '<div class="pix-copia-cola"><input readonly id="pix-codigo" value="'+qrCode+'"><button onclick="copiarPix()">Copiar</button></div>'+
    '<div class="modal-pix-aviso">✅ Assim que o pagamento for aprovado, seu pedido é confirmado automaticamente.</div>'+
    '<button class="modal-pix-fechar" onclick="this.closest(\'.modal-pix-fundo\').remove(); window.location.href=\'index.html\';">Fechar</button>'+
  '</div>';
  document.body.appendChild(m);
}

function copiarPix(){
  var input=document.getElementById('pix-codigo');
  input.select();
  navigator.clipboard.writeText(input.value).then(function(){ mostrarToast('✅ Código copiado!'); });
}

function renderizarCarrinho(){
  var c=document.getElementById('carrinho-content');
  if(carrinho.length===0){c.innerHTML='<div class="carrinho-vazio"><div style="font-size:5rem;">🛒</div><h2>Carrinho Vazio</h2><p><a href="index.html" style="color:var(--amarelo);">← Voltar</a></p></div>'; return;}
  usuario=JSON.parse(localStorage.getItem('usuario_discord'));

  var itensHtml='';
  carrinho.forEach(function(item){
    itensHtml+='<div class="carrinho-item">';
    if(item.imagem)itensHtml+='<img src="'+item.imagem+'">'; else itensHtml+='<div class="carrinho-item-emoji">'+(item.emoji||'📦')+'</div>';
    itensHtml+='<div class="carrinho-item-info"><div class="carrinho-item-nome">'+item.nome+'</div><div class="carrinho-item-preco">R$ '+Number(item.preco).toFixed(2)+' cada</div></div>';
    itensHtml+='<div class="carrinho-qtd"><button class="btn-qtd" onclick="alterarQuantidade('+item.id+',-1)">-</button><span>'+item.quantidade+'</span><button class="btn-qtd" onclick="alterarQuantidade('+item.id+',1)">+</button></div>';
    itensHtml+='<div style="font-weight:bold;">R$ '+(item.preco*item.quantidade).toFixed(2)+'</div>';
    itensHtml+='<button class="btn-remover" onclick="removerItem('+item.id+')">🗑️</button></div>';
  });

  var resumoHtml='';
  resumoHtml+='<div class="cupom-section"><h3>🏷️ Cupom</h3>';
  if(cupomAplicado)resumoHtml+='<div class="cupom-aplicado"><span>✅ '+cupomAplicado.codigo+'</span><button onclick="removerCupom()" style="background:#ef4444;color:white;border:none;padding:0.3rem 0.8rem;border-radius:5px;cursor:pointer;">Remover</button></div>';
  else resumoHtml+='<div class="cupom-input"><input id="input-cupom" placeholder="Código"><button onclick="aplicarCupom()">Aplicar</button></div><div class="cupom-erro-msg" id="cupom-erro-msg"></div>';
  resumoHtml+='</div>';

  if(temVipClanNoCarrinho()){
    resumoHtml+='<div class="token-clan-section"><h3>🏰 Token do Clã</h3><small>Seu carrinho tem um VIP de Clã. Digite o token do clã que vai receber o benefício.</small><input id="input-token-clan" placeholder="Ex: F234C" value="'+tokenClan+'" oninput="tokenClan=this.value.toUpperCase()" maxlength="10"></div>';
  }

  resumoHtml+='<div class="pagamento-section"><h3>💳 Forma de Pagamento</h3><div class="pagamento-opcoes">';
  resumoHtml+='<div class="pagamento-opt'+(metodoSelecionado==='mercadopago'?' selecionado':'')+'" onclick="selecionarMetodo(\'mercadopago\')">💳 Mercado Pago<br><small>PIX / Crédito / Débito / Boleto, etc.</small></div>';
  resumoHtml+='<div class="pagamento-opt'+(metodoSelecionado==='mby'?' selecionado':'')+'" onclick="selecionarMetodo(\'mby\')">🌎 MBY</div>';
  resumoHtml+='</div>';
  if(metodoSelecionado==='mby'){
    resumoHtml+='<div class="euro-preview">'+(valorEuroPreview==='...' ? 'Calculando conversão...' : (valorEuroPreview ? '≈ €'+Number(valorEuroPreview).toFixed(2)+' (cobrado em Euro)' : 'Não foi possível calcular a conversão'))+'</div>';
  }
  resumoHtml+='</div>';

  resumoHtml+='<div class="carrinho-total">';
  resumoHtml+='<div class="total-linha"><span>Subtotal</span><span>R$ '+calcularSubtotal().toFixed(2)+'</span></div>';
  if(calcularDesconto()>0)resumoHtml+='<div class="total-linha" style="color:var(--verde);"><span>Desconto</span><span>-R$ '+calcularDesconto().toFixed(2)+'</span></div>';
  resumoHtml+='<div class="total-final">Total: R$ '+calcularTotal().toFixed(2)+'</div>';
  if(!usuario)resumoHtml+='<div class="aviso-login"><p>🔐 Faça login!</p><button class="btn-login-discord" onclick="loginDiscord()">Login com Discord</button></div>';
  else resumoHtml+='<button class="btn-finalizar" onclick="finalizarCompra()">✅ Ir para pagamento</button>';
  resumoHtml+='</div>';

  c.innerHTML='<div class="carrinho-grid"><div class="carrinho-itens">'+itensHtml+'</div><div class="carrinho-resumo">'+resumoHtml+'</div></div>';
}
</script>
</body>
</html>
