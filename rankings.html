<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="titulo-pagina">ReyCraft Shop - Rankings</title>
<link id="favicon-pagina" rel="icon" href="https://i.imgur.com/TneGRwW.png">
<script src="js/db.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --roxo: #8B5CF6; --verde: #10B981; --amarelo: #F59E0B; --fundo: #0a0a0f; --card: #14141f; --texto: #E2E8F0; --texto-cinza: #94A3B8; }
body { font-family: 'Segoe UI', sans-serif; background: var(--fundo); color: var(--texto); min-height: 100vh; }
.header { background: #0a0a0f; padding: 0.8rem 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-voltar { color: var(--amarelo); text-decoration: none; font-weight: bold; font-size: 1.2rem; }
.header-logo img { height: 40px; }
.icon-btn { width: 40px; height: 40px; background: var(--amarelo); border-radius: 8px; display: flex; align-items: center; justify-content: center; text-decoration: none; }
.icon-btn img { width: 20px; height: 20px; filter: brightness(0); }
.icon-avatar { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; border: 2px solid var(--amarelo); }
.container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
.tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; position: sticky; top: 70px; z-index: 50; background: var(--fundo); padding: 1rem 0; }
.tab-btn { padding: 0.8rem 1.5rem; background: var(--card); border: 2px solid transparent; color: var(--texto-cinza); border-radius: 8px; cursor: pointer; font-weight: bold; }
.tab-btn:hover { border-color: var(--roxo); }
.tab-btn.ativo { background: var(--roxo); color: white; }
.ranking-list { display: flex; flex-direction: column; gap: 0.5rem; }
.ranking-card { background: var(--card); padding: 1.2rem 1.5rem; border-radius: 10px; display: flex; align-items: center; gap: 1rem; border: 1px solid #1e1e2e; }
.ranking-pos { font-size: 1.5rem; font-weight: bold; width: 50px; text-align: center; }
.ranking-info { flex: 1; }
.ranking-nome { font-weight: bold; font-size: 1.1rem; }
.ranking-sub { color: var(--texto-cinza); font-size: 0.85rem; }
.ranking-valor { font-weight: bold; color: var(--verde); font-size: 1.2rem; }
.medalha-1 { color: #FFD700; } .medalha-2 { color: #C0C0C0; } .medalha-3 { color: #CD7F32; }
.sem-dados { text-align: center; padding: 3rem; color: var(--texto-cinza); }
@media (max-width: 768px) { .header { padding: 0.8rem 1rem; } .tabs { overflow-x: auto; } .tab-btn { white-space: nowrap; } }
</style>
</head>
<body>
<header class="header">
<a href="index.html" class="header-voltar">←</a>
<a href="index.html" class="header-logo"><img src="https://i.imgur.com/TneGRwW.png" id="logo-img"></a>
<a href="perfil.html" id="btn-perfil" class="icon-btn"><img src="https://cdn-icons-png.flaticon.com/512/3106/3106921.png" id="perfil-img" style="width:20px;height:20px;filter:brightness(0);"></a>
</header>
<div class="container">
<div class="tabs">
<button class="tab-btn ativo" onclick="mostrarRanking('clans')">🛡️ TOP Clãs</button>
<button class="tab-btn" onclick="mostrarRanking('jogadores')">👤 TOP Jogadores</button>
<button class="tab-btn" onclick="mostrarRanking('donaters')">💎 TOP Donaters</button>
</div>
<div id="ranking-content" class="ranking-list"></div>
</div>
<script>
(function(){var c=JSON.parse(localStorage.getItem('config_loja')); if(c){if(c.nomeSite)document.getElementById('titulo-pagina').textContent=c.nomeSite+' - Rankings'; if(c.favicon)document.getElementById('favicon-pagina').href=c.favicon; if(c.logoUrl){var l=document.getElementById('logo-img');if(l)l.src=c.logoUrl;} if(c.logoTamanho){var l=document.getElementById('logo-img');if(l)l.style.height=c.logoTamanho+'px';}}})();
(function(){var u=JSON.parse(localStorage.getItem('usuario_discord')),b=document.getElementById('btn-perfil'),i=document.getElementById('perfil-img'); if(!b||!i)return; if(u&&u.avatar){b.style.background='transparent'; i.src=u.avatar; i.style.width='40px'; i.style.height='40px'; i.style.borderRadius='8px'; i.style.filter='none'; i.style.objectFit='cover';}})();
var rankingAtual='clans';
var clansAtivos=null; // null = ainda não carregado
fetch('/api/kills-data').then(function(r){return r.json();}).then(function(data){
    clansAtivos=(data.clans||[]).map(function(c){return c.nome;});
    renderizarRanking();
}).catch(function(){ clansAtivos=[]; });
function mostrarRanking(t){rankingAtual=t; document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('ativo')}); event.target.classList.add('ativo'); renderizarRanking();}
function getTopClans(){
var pedidos=JSON.parse(localStorage.getItem('pedidos'))||[], clans={};
pedidos.filter(function(p){return p.status==='confirmado'}).forEach(function(p){var c=p.clan||'Sem Clan'; if(!clans[c])clans[c]={nome:c,pontos:0,membros:new Set()}; clans[c].pontos+=Number(p.valor||0); clans[c].membros.add(p.discordId);});
var r=Object.values(clans);
if(clansAtivos && clansAtivos.length>0){ r=r.filter(function(c){return clansAtivos.indexOf(c.nome)!==-1;}); }
r=r.map(function(c){return{nome:c.nome,pontos:c.pontos,membros:c.membros.size}}); r.sort(function(a,b){return b.pontos-a.pontos}); return r.slice(0,10);
}
function getTopJogadores(){
var pedidos=JSON.parse(localStorage.getItem('pedidos'))||[], j={};
pedidos.filter(function(p){return p.status==='confirmado'}).forEach(function(p){var n=p.cliente||'Desconhecido'; if(!j[n])j[n]={nome:n,pontos:0,clan:p.clan||'Sem Clan'}; j[n].pontos+=Number(p.valor||0);});
var r=Object.values(j); r.sort(function(a,b){return b.pontos-a.pontos}); return r.slice(0,10);
}
function getTopDonaters(){
var pedidos=JSON.parse(localStorage.getItem('pedidos'))||[], d={};
pedidos.filter(function(p){return p.status==='confirmado'}).forEach(function(p){var n=p.cliente||'Desconhecido'; if(!d[n])d[n]={nome:n,valor:0,clan:p.clan||'Sem Clan'}; d[n].valor+=Number(p.valor||0);});
var r=Object.values(d); r.sort(function(a,b){return b.valor-a.valor}); return r.slice(0,10);
}
function renderizarRanking(){
var c=document.getElementById('ranking-content'), dados=[], tipo='pontos';
if(rankingAtual==='clans')dados=getTopClans();
else if(rankingAtual==='jogadores')dados=getTopJogadores();
else{dados=getTopDonaters(); tipo='R$';}
if(dados.length===0){c.innerHTML='<div class="sem-dados">📭 Nenhum dado ainda</div>'; return;}
var medals=['🥇','🥈','🥉'];
c.innerHTML=dados.map(function(item,i){
var mc=i<3?'medalha-'+(i+1):'', pos=i<3?medals[i]:(i+1)+'º', v=tipo==='R$'?'R$ '+Number(item.valor).toFixed(2):item.pontos+' pts', sub='';
if(rankingAtual==='clans')sub=item.membros+' membros';
if(rankingAtual==='jogadores'||rankingAtual==='donaters')sub='<span style="color:var(--roxo);">'+(item.clan||'Sem Clan')+'</span>';
return '<div class="ranking-card"><div class="ranking-pos '+mc+'">'+pos+'</div><div class="ranking-info"><div class="ranking-nome">'+item.nome+'</div>'+(sub?'<div class="ranking-sub">'+sub+'</div>':'')+'</div><div class="ranking-valor">'+v+'</div></div>';
}).join('');
}
</script>
</body>
</html>
